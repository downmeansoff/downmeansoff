<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340" role="img" aria-labelledby="title desc">
  <title id="title">Gleb Lutfullin, AI Engineer</title>
  <desc id="desc">Animated profile banner for AI Engineering, Agentic Systems, DevOps and Platform Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#172554;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1d4ed8">
        <animate attributeName="stop-color" values="#1d4ed8;#4f46e5;#1d4ed8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#a855f7;#7c3aed" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="340" rx="18" fill="url(#bg)"/>

  <circle cx="120" cy="80" r="68" fill="#38bdf8" opacity="0.10" filter="url(#glow)">
    <animate attributeName="cx" values="120;1480;120" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1430" cy="115" r="90" fill="#c084fc" opacity="0.10" filter="url(#glow)">
    <animate attributeName="cx" values="1430;170;1430" dur="18s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.10">
    <path d="M0 72 H1600"/>
    <path d="M0 144 H1600"/>
    <path d="M0 216 H1600"/>
    <path d="M200 0 V340"/>
    <path d="M600 0 V340"/>
    <path d="M1000 0 V340"/>
    <path d="M1400 0 V340"/>
  </g>

  <text x="800" y="138" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="1">Gleb Lutfullin</text>
  <text x="800" y="194" text-anchor="middle" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="1.5">AI ENGINEER  •  AGENTIC SYSTEMS  •  DEVOPS &amp; PLATFORM</text>

  <g transform="translate(800 234)">
    <rect x="-315" y="-20" width="630" height="42" rx="21" fill="#0b1220" fill-opacity="0.36" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="0" y="8" text-anchor="middle" fill="#e0e7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Production AI workflows · Backend · Mobile · Infrastructure · Reliability</text>
  </g>

  <path d="M0 270 C240 325 410 255 640 288 C860 320 1080 248 1600 286 L1600 340 L0 340 Z" fill="url(#wave)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 270 C240 325 410 255 640 288 C860 320 1080 248 1600 286 L1600 340 L0 340 Z;M0 286 C240 248 430 328 650 280 C880 230 1110 322 1600 268 L1600 340 L0 340 Z;M0 270 C240 325 410 255 640 288 C860 320 1080 248 1600 286 L1600 340 L0 340 Z"/>
  </path>
  <path d="M0 296 C270 255 440 330 720 295 C1000 260 1220 320 1600 290 L1600 340 L0 340 Z" fill="#ffffff" fill-opacity="0.10">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 296 C270 255 440 330 720 295 C1000 260 1220 320 1600 290 L1600 340 L0 340 Z;M0 285 C260 335 470 252 730 302 C980 350 1240 248 1600 300 L1600 340 L0 340 Z;M0 296 C270 255 440 330 720 295 C1000 260 1220 320 1600 290 L1600 340 L0 340 Z"/>
  </path>
</svg>
